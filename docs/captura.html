<title>Super Oficial de Mesa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Concepto: planilla de mesa de básquet. Barlow Condensed para números y rótulos, Barlow para texto.
   Color: gris azulado de cancha cubierta, naranja de pelota como acento; azul y ciruela distinguen equipos.
   Botonera en 3 burbujas de color: gestión (gris), juego (azul) y puntos (naranja). El reloj es un tablero LED. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --soft:#F4F6F9; --ink:#141B24; --muted:#586471; --line:#D2D8DF;
  --accent:#C2410C; --accent-ink:#FFFFFF; --local:#1F5FA8; --visit:#A12F86;
  --ok:#16794C; --warn:#9A5B00; --bad:#B42318; --bad-soft:#FDECEA; --ok-soft:#E6F4EC; --warn-soft:#FFF3DC;
  --bg-ges:#E4E8EE; --bg-jue:#DCE9F7; --bg-pun:#FBE6D8;
  --f-display:'Barlow Condensed','Arial Narrow',sans-serif; --f-body:'Barlow','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141A; --surface:#19212A; --soft:#141B22; --ink:#E9EDF1; --muted:#98A5B2; --line:#2C3743;
  --accent:#FF8A4C; --accent-ink:#1C0F07; --local:#78AEF2; --visit:#E88ACB;
  --ok:#5FD39B; --warn:#F2B35A; --bad:#FF8A7E; --bad-soft:#3A1D1A; --ok-soft:#14301F; --warn-soft:#38290F;
  --bg-ges:#232C36; --bg-jue:#1B2C42; --bg-pun:#3B2619; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#19212A; --soft:#141B22; --ink:#E9EDF1; --muted:#98A5B2; --line:#2C3743;
  --accent:#FF8A4C; --accent-ink:#1C0F07; --local:#78AEF2; --visit:#E88ACB;
  --ok:#5FD39B; --warn:#F2B35A; --bad:#FF8A7E; --bad-soft:#3A1D1A; --ok-soft:#14301F; --warn-soft:#38290F;
  --bg-ges:#232C36; --bg-jue:#1B2C42; --bg-pun:#3B2619; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;margin:0;
  padding-block:0 28px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{padding:12px 0 8px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand h1{font:700 24px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.tag{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:4px 8px;border-radius:4px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.step{font:600 11px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid var(--line);padding:5px 0;white-space:nowrap}
.step.on{color:var(--ink);border-color:var(--accent)}
.step.done{color:var(--ok);border-color:var(--ok)}
h2{font:700 24px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:18px 0 8px}
h3{font:700 18px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px}
p{margin:0 0 10px;text-wrap:pretty}
.lead{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field label{font:600 13px var(--f-body);color:var(--muted);letter-spacing:.03em}
.field input,.field select{min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:360px){.two{grid-template-columns:1fr}.three{grid-template-columns:1fr}}
.sec-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 14px var(--f-display);margin-right:8px;vertical-align:2px}
.btn{min-height:52px;padding:10px 16px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:700 18px var(--f-display);letter-spacing:.05em;text-transform:uppercase;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:44px;font-size:16px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;min-height:44px;padding:0 6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{min-height:48px;border:0;background:var(--surface);font-weight:600;padding:0 6px}
.seg button.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips button{min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:22px;font-weight:600}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:grid;grid-template-columns:28px 1fr 78px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
.row input[type=number]{min-height:44px;width:78px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center;font:700 20px var(--f-display)}
.row input[type=number]:disabled{opacity:.35}
.row small{display:block;color:var(--muted);font-size:12px}
.mk{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.mk select{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;max-width:160px}
.chk{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:4px}
.chk li{display:flex;gap:8px;align-items:flex-start;font-size:15px;min-width:0}
.chk .i{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-body)}
.chk .ok .i{background:var(--ok-soft);color:var(--ok)} .chk .no .i{background:var(--bad-soft);color:var(--bad)} .chk .ad .i{background:var(--warn-soft);color:var(--warn)}
:root{--localraw:#1F5FA8;--local2:#FFFFFF;--localx:#FFFFFF;--localj:#FFFFFF;--visitraw:#A12F86;--visit2:#FFFFFF;--visitx:#FFFFFF;--visitj:#FFFFFF}
.tl{--c:var(--local);--c1:var(--localraw);--c2:var(--local2);--cx:var(--localx);--cj:var(--localj)}
.tv{--c:var(--visit);--c1:var(--visitraw);--c2:var(--visit2);--cx:var(--visitx);--cj:var(--visitj)}

/* Marcador: cuartos arriba, reloj al centro entre los dos puntajes, luces de tiempos muertos abajo */
.board{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.qrow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.qv{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font:700 19px var(--f-display)}
.qv.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qv.ex{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.srow,.lrow{display:grid;grid-template-columns:1fr 124px 1fr;align-items:center;gap:6px}
.board .eq{position:relative;isolation:isolate;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.board .eq::before{content:"";position:absolute;inset:-6px -2px;z-index:-1;background:var(--esc) center/contain no-repeat;opacity:.16;pointer-events:none}
.board .eq span{display:block;font:600 13px var(--f-body);letter-spacing:.05em;text-transform:uppercase;overflow-wrap:anywhere;color:var(--c)}
.board .eq b.pt{display:block;font:700 62px/1 var(--f-display);font-variant-numeric:tabular-nums}
.board .eq small{font:600 12px var(--f-body);color:var(--muted)}
.board .eq small b{color:var(--ink);font-size:14px}
/* Reloj tipo tablero: verde en marcha, naranja titilando en pausa (para acordarse de arrancarlo) */
.clk{min-height:84px;width:100%;border:3px solid #3DDC84;border-radius:10px;background:#0A0E12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.clk .dg{font:700 38px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.02em;color:#3DDC84}
.clk small{font:700 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:#9EE9BE;text-align:center}
.clk.pau{border-color:#FFA14A}.clk.pau .dg{color:#FFA14A}.clk.pau small{color:#FFC48A}
@media (prefers-reduced-motion:no-preference){.clk.pau{animation:pau 1.1s steps(2,jump-none) infinite}@keyframes pau{50%{box-shadow:0 0 0 4px rgba(255,161,74,.45)}}}
.adj{min-height:40px;border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12px}
/* Luces de tiempos muertos: horizontales, un color por grupo; se apagan al usarse */
.lights{display:flex;gap:5px;justify-content:center;align-items:center;min-height:20px}
.lt{width:21px;height:9px;border-radius:5px;background:var(--k);box-shadow:0 0 7px var(--k)}
.lt.used{background:var(--line);box-shadow:none}
.lt.pen{background:transparent;border:2px dashed var(--k);box-shadow:none}
.lt.tenue{opacity:.4}
.lg .lights+.lights{min-height:9px}
.lg{display:grid;gap:4px}
.lt.exp{background:var(--line);opacity:.45;box-shadow:none}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:11px;color:var(--muted)}
.leg i{display:inline-block;width:14px;height:7px;border-radius:4px;background:var(--k);margin-right:4px;vertical-align:1px}

/* Botonera en 3 burbujas */
.bub{border-radius:14px;padding:8px;margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bub.ges{background:var(--bg-ges)} .bub.jue{background:var(--bg-jue)} .bub.pun{background:var(--bg-pun)}
.ac{min-height:58px;border:2px solid transparent;border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px}
.ac b{font:700 24px/1 var(--f-display);letter-spacing:.02em}
.ac small{font:600 11px var(--f-body);letter-spacing:.05em;text-transform:uppercase;opacity:.8}
.ac.on{border-color:var(--accent);outline:3px solid var(--accent);outline-offset:1px}
/* Cada grupo con su estética: gestión = placas rectas con base gruesa (acero); juego = pastillas redondas (azul); puntos = fichas de colores */
.bl{grid-column:1/-1;font:700 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
/* Acción (pérdida · falta · robo): negro con letras blancas; al elegirla titila con su color */
.bub.acn{background:#000;border:2px solid #000}
.acn .ac{background:#000;color:#fff;border-color:#fff3;min-height:62px}
.acn .ac b{font-size:26px;letter-spacing:.06em;text-transform:uppercase}
.acn .ac.on{outline:none;border-color:#fff}
.acn .ac.on.a-PER{background:#fff;color:#D4182B}
.acn .ac.on.a-FALTA{background:#FF7A00;color:#000}
.acn .ac.on.a-ROB{background:#fff;color:#16794C}
@media (prefers-reduced-motion:no-preference){.acn .ac.on{animation:blk .9s steps(1,end) infinite}}
@keyframes blk{50%{background:#000;color:#fff}}
/* Gestión (cambio · tiempo): discreta */
.bub.ges{grid-template-columns:1fr 1fr;border-left:6px solid #5B6B7C}
.ges .ac{border-radius:4px;border-bottom:4px solid #5B6B7C;background:var(--surface)}
.ges .ac b{font-size:21px;letter-spacing:.06em;text-transform:uppercase}
/* Rebote tras un errado: panel verde */
.sug.reb{background:linear-gradient(135deg,#0F5132,#1F7A45);border-color:#6EE7A0}
.sug.reb .h b,.sug.reb .h span,.sug.reb h4{color:#fff}.sug.reb h4{border-color:#fff}
.sug.reb .link{color:#fff}
/* Puntos en 2 pasos: 1) tipo de tiro (verde, blanco, amarillo tenues) 2) errado (rojo y negro) o convertido (verde, amarillo y blanco) */
.pun .stp{grid-column:1/-1;margin:-2px 0 -2px 2px;font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tp{min-height:78px;border:2px solid transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px;color:#14201A}
.tp b{font:700 34px/1 var(--f-display);letter-spacing:.06em}
.tp small{font:600 11px var(--f-body);letter-spacing:.05em;text-transform:uppercase;opacity:.8}
.tp.t1{background:#BFE5CB}.tp.t2{background:#FFFFFF}.tp.t3{background:#F7E7A1}
.tp.on{border-color:#14201A;outline:3px solid var(--accent);outline-offset:1px}
.res{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rs{min-height:66px;border:2px solid transparent;border-radius:10px;font:700 28px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.rs.x{background:#3A0F10;color:#FFD9D6;border-color:#B42318}
.rs.c{background:#1F7A45;color:#fff;border-color:#F2D13B}
.rs.on{outline:3px solid #fff;outline-offset:1px;box-shadow:0 0 0 5px #14201A}
.bub.pun.ok{background:linear-gradient(135deg,#2E9E5B 0%,#F2D13B 62%,#FFFFFF 100%)}
.bub.pun.ko{background:linear-gradient(135deg,#B42318 0%,#2A0A0B 60%,#000 100%)}
.pun.ok .stp,.pun.ok .bl{color:#072013}.pun.ko .stp,.pun.ko .bl{color:#FFD9D6}
.pun.ko .tp:not(.on){opacity:.55}.pun.ko .tp.on{outline-color:#fff;border-color:#000}

/* Centro de sugerencias */
.sug{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:10px;margin-top:8px}
.bub>.sug{grid-column:1/-1;margin-top:2px;color:var(--ink)}
.sug.idle{border-color:var(--line);border-style:dashed;color:var(--muted)}
.sug .h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.sug .h b{font:700 18px var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.sug .h span{color:var(--muted);font-size:13px}
.scols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scols h4{font:700 14px var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--c);margin:0 0 4px;border-bottom:2px solid var(--c);padding-bottom:2px}
.pp{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"n nm" "n rz";column-gap:8px;width:100%;min-height:48px;padding:4px 8px;margin-bottom:5px;text-align:left;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;background:var(--surface);align-items:center}
.pp .num{grid-area:n;font:700 26px/1 var(--f-display);min-width:30px;text-align:center}
.pp .nm{grid-area:nm;font-weight:600;font-size:14px;overflow-wrap:anywhere;line-height:1.15}
.pp .rz{grid-area:rz;font-size:11px;color:var(--muted);line-height:1.15}
.pp.solo{grid-template-areas:"n nm"}
.pp.sel{outline:3px solid var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.sec{min-height:52px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600;padding:4px 8px}

/* En cancha con minutos */
.cancha{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cancha h4{font:700 14px var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--c);margin:0 0 4px;border-bottom:2px solid var(--c);padding-bottom:2px}
.cj{display:grid;grid-template-columns:auto 1fr auto;column-gap:6px;align-items:center;padding:5px 2px;border-bottom:1px solid var(--line);font-size:13px;min-width:0;width:100%;background:none;border-top:0;border-left:0;border-right:0;text-align:left}
.cj .num{font:700 20px/1 var(--f-display);min-width:24px;text-align:center}
.cj .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cj .mn{font:700 15px var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted)}
.cj .fl{font-size:10px;color:var(--bad);font-weight:700;display:block;line-height:1}

.last{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:8px 10px;margin:12px 0}
.last .d{min-width:0;overflow-wrap:anywhere;font-size:15px}
.last .d small{display:block;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.fx{min-height:44px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:600;font-size:14px}
.note{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn);padding:10px 12px;border-radius:6px;margin:10px 0;font-size:15px}
.hint{color:var(--muted);font-size:14px;margin:0 0 6px}
.bar{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;margin:12px 0}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.feed .d{min-width:0;overflow-wrap:anywhere;font-size:15px}
.feed .d small{display:block;color:var(--muted);font-size:12px}
.feed li.anul .d{text-decoration:line-through;color:var(--muted)}
.badge{display:inline-block;font:700 12px var(--f-body);padding:2px 6px;border-radius:4px;background:var(--soft);color:var(--muted);margin-right:4px}
.badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.ok{background:var(--ok-soft);color:var(--ok)}
.tblw{overflow-x:auto;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left} th{font:600 12px var(--f-body);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
td.v{font-weight:700}
.over{position:fixed;inset:0;background:rgba(10,14,18,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin-top:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.opts button{min-height:52px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600;padding:6px 8px;text-align:left}
.opts button.on{border-color:var(--accent);outline:2px solid var(--accent)}
.cmp{display:grid;gap:6px;background:var(--soft);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:15px}
.win{font:700 30px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:6px 0}
.done li{padding:4px 0}
.liga{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px}
.shot{display:inline-block;background:var(--soft);border-radius:6px;padding:2px 8px;font:700 14px var(--f-display);letter-spacing:.04em}
.fly{display:grid;gap:14px;margin:8px 0 12px}
.fly figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.fly img{width:100%;height:auto;display:block;border-radius:8px;background:#0E1319;aspect-ratio:4/5}
.fly figcaption{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-weight:600;font-size:14px}
.fly a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);font-weight:600}
textarea.cap{width:100%;min-height:150px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);resize:vertical;font-size:15px}

  marlin:{nombre:'Marlín',c1:'#1F5FA8',c2:'#FFFFFF',jug:[J('Lucas Pérez',178,'B'),J('Mateo Ruiz',184,'E'),J('Bruno Gómez',192,'A'),J('Iván Torres',199,'AP'),J('Tomás Díaz',205,'P'),J('Joaquín Luna',181,'B'),J('Santi Rey',190,'A'),J('Agustín Paz',202,'P')]},
  sierra:{nombre:'Sierra',c1:'#C0392B',c2:'#111111',jug:[J('Nicolás Vera',176,'B'),J('Fede Mora',185,'E'),J('Ramiro Cruz',193,'A'),J('Gonzalo Sosa',198,'AP'),J('Dante Ríos',207,'P'),J('Pablo Ibarra',183,'E'),J('Emi Salas',189,'A'),J('Ciro Vega',201,'AP')]},
  costa:{nombre:'Costa',c1:'#1E8E5A',c2:'#F2D13B',jug:[J('Ariel Núñez',179,'B'),J('Bruno Aguirre',186,'E'),J('Cristian Lara',194,'A'),J('Diego Funes',200,'AP'),J('Elías Mena',206,'P'),J('Franco Ojeda',182,'B'),J('Gael Bravo',191,'A'),J('Hugo Silva',203,'P')]},
  pinar:{nombre:'Pinar',c1:'#E67E22',c2:'#111111',jug:[J('Ian Rojas',177,'B'),J('Julián Cano',187,'E'),J('Kevin Soto',195,'A'),J('Leo Marín',197,'AP'),J('Matías Gil',204,'P'),J('Nahuel Ponce',184,'E'),J('Omar Ledesma',192,'A'),J('Pedro Arce',200,'AP')]}

/* Tabla de la categoría ANTES del partido (ejemplo). En la versión real sale de BASE › Posiciones. */

const CATS=['+20','+30','+40'];
const FASES=['Fase regular','Playoff','Cuartos de final','Semifinal','Final'];
if(TLX&&TLX.fase&&!FASES.includes(TLX.fase))FASES.push(TLX.fase);
if(TLX&&!LIGAS.some(l=>l.id===TLX.liga))LIGAS.push({id:TLX.liga,nombre:TLX.ligaNombre||TLX.liga,clave:''});
const FALTAS=[['personal','Personal'],['tecnica','Técnica'],['antideportiva','Antideportiva'],['descalificante','Descalificante']];
const ETQ={P1:'Tiro libre',P2:'Doble',P3:'Triple',X1:'Libre errado',X2:'Doble errado',X3:'Triple errado',FALTA:'Falta',CAMBIO:'Cambio',TM:'Tiempo muerto',QUINTETO:'Quinteto',PER:'Pérdida',REB:'Rebote',ROB:'Robo',AST:'Asistencia'};

const POSRANK={B:0,E:1,A:2,AP:3,P:4};
/* Esquema propio de valoración (borrador). En la versión real vive en BASE › Config y se cambia sin tocar código. */
const CFG={cuarto:600,ot:300,ganar:2,perder:1,
  val:{pts:1,reb:1,rob:1.5,ast:1.5,per:-1.5,falta:-0.5,x1:-0.3,x2:-0.5,x3:-0.5}};
const qlen=q=>q<=4?CFG.cuarto:CFG.ot;
const qstart=q=>{let t=0;for(let i=1;i<q;i++)t+=qlen(i);return t};
const qlab=q=>q<=4?q+'.º':'Ex'+(q-4);
const NEEDJ=['P1','P2','P3','X1','X2','X3','FALTA','PER','REB','ROB','AST'];
const PUNTOS=['P1','P2','P3'],ERRADOS=['X1','X2','X3'];
/* Tiempos muertos: 2 en cuartos 1-2; 3 en cuartos 3-4 (el tercero, solo en los últimos 2 min del 4.º); 1 por suplementario (supuesto, a confirmar) */
const TM_FINAL=120;
const PENAL=4;   /* faltas de equipo en el cuarto desde las que aparece la bandera de penalización */
let DQ={};       /* descalificados del estado que se está dibujando */
const GRUPOS_TM=[['#E9A400','1.ª mitad (2)'],['#2F80ED','2.ª mitad (2)'],['#E5484D','final del 4.º (1)'],['#8B5CF6','suplementario (1)']];

/* ---------- Estado ---------- */
let S;
function nuevo(){
  S={fase:0,cuarto:1,sec:0,run:false,vel:1,cerrado:false,liga:null,fly:null,cap:'',
    d:{cam:{local:null,visitante:null},cat:'+30',local:'',visit:'',fase:'Fase regular',cancha:'',fecha:'',hora:'',arb:['','',''],mesa:['','']},
    plant:{local:{},visitante:{}},quin:{local:[],visitante:[]},par:{},ev:[],corr:[],nid:1,nseq:1,
    ui:{tab:'local',acc:null,pf:null,pc:null,ast:null,reb:null,bp:null,mc:false,pt:null,todos:false,stats:null,corr:null,ajuste:false,sheetPar:false,hint:false,lg:'mar-y-sierra',clave:'',err:'',ign:{}}};
}
nuevo();
function aplicarTL(){
  {const t=document.getElementById('tag');if(t)t.textContent='Planilla · TU LIGA'}
  S.liga=TLX.liga;S.fase=1;
  Object.assign(S.d,{local:TLX.local,visit:TLX.visit,cat:TLX.cat,fase:TLX.fase,cancha:TLX.cancha,fecha:TLX.fecha,hora:TLX.hora});
  ['local','visitante'].forEach(eq=>{const k=eq==='local'?TLX.local:TLX.visit;S.plant[eq]={};TEAMS[k].jug.forEach((j,i)=>{S.plant[eq][k+'-'+(i+1)]={p:false,c:j.cam!=null?String(j.cam):''}})});
}
function restaurar(){
  const RT=TLX.retomar;if(!RT||TLX._r)return;TLX._r=1;
  (RT.arb||[]).forEach((v,i)=>{S.d.arb[i]=v||''});(RT.mesa||[]).forEach((v,i)=>{S.d.mesa[i]=v||''});
  RT.pj.forEach(q=>{S.plant[q.eq][q.id]={p:true,c:String(q.cam)};if(q.tit)S.quin[q.eq].push(q.id)});
  S.ev=RT.ev.map(e=>({id:e.id,seq:e.seq,cuarto:e.cuarto,t:qstart(e.cuarto)+(qlen(e.cuarto)-e.rs),anulado:false,corrige:null,equipo:e.equipo,jug:e.jug,tipo:e.tipo,det:e.det,j2:e.j2,ref:e.ref}));
  S.nid=S.ev.reduce((m,e)=>Math.max(m,e.id),0)+1;S.nseq=S.ev.reduce((m,e)=>Math.max(m,e.seq),0)+1;
  const q=S.ev.reduce((m,e)=>Math.max(m,e.cuarto),1);S.cuarto=q;S.sec=Math.max(0,S.ev.filter(e=>e.cuarto===q).reduce((m,e)=>Math.max(m,e.t),qstart(q))-qstart(q));
  const total=S.ev.length;let ok=true;
  while(S.ev.length){const E=calc(S.ev);if(!E.err)break;S.ev.pop();ok=false}      /* si alguna jugada no cumple las reglas, se retoma hasta la última válida */
  if(!ok)TLX._trunc=total-S.ev.length;
  const q2=S.ev.reduce((m,e)=>Math.max(m,e.cuarto),1);S.cuarto=q2;S.sec=Math.max(0,S.ev.filter(e=>e.cuarto===q2).reduce((m,e)=>Math.max(m,e.t),qstart(q2))-qstart(q2));
  const R=calc(S.ev);S.par=Object.assign({},pares(R.on.local,R.on.visitante));S.run=false;S.fase=3;
}
if(TLX)aplicarTL();

/* ---------- Ayudas ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const otro=eq=>eq==='local'?'visitante':'local';
const tk=eq=>eq==='local'?S.d.local:S.d.visit;
/* Colores de equipo: cada equipo elige en la base una camiseta principal y una alternativa (hex).
   Si los dos principales se parecen, el visitante usa su alternativo para no confundirse. */
const hex2=h=>{h=String(h).replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16)||0)};
const lum=h=>{const c=hex2(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const contr=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const mez=(h,t,p)=>{const a=hex2(h),b=hex2(t);return '#'+a.map((v,i)=>('0'+Math.round(v+(b[i]-v)*p).toString(16)).slice(-2)).join('')};
const dist=(a,b)=>{const x=hex2(a),y=hex2(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])};
const oscuro=()=>{try{const t=document.documentElement.dataset.theme;return t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}};
const camBase=eq=>{const t=TEAMS[tk(eq)];return {c1:(t&&t.c1)||(eq==='local'?'#1F5FA8':'#A12F86'),c2:(t&&t.c2)||'#FFFFFF',ok:!!(t&&t.c1)}};
const camColores=(eq,v)=>{const b=camBase(eq);return v==='a'?{c1:b.c2,c2:b.c1}:{c1:b.c1,c2:b.c2}};
/* Sugerencia: el local usa su camiseta principal; el visitante usa la principal salvo que se parezca a la del local */
function sugCam(){
  const Lv=S.d.cam.local||'p',Lc=camColores('local',Lv).c1,V=camBase('visitante');
  const choque=dist(Lc,V.c1)<85&&dist(Lc,V.c2)>dist(Lc,V.c1);
  return {local:'p',visitante:choque?'a':'p',choque:dist(Lc,V.c1)<85};
}
function paleta(){
  const sg=sugCam();
  return {local:camColores('local',S.d.cam.local||sg.local),visitante:camColores('visitante',S.d.cam.visitante||sg.visitante)};
}
function nombreColor(h){
  const c=hex2(h),mx=Math.max(c[0],c[1],c[2]),mn=Math.min(c[0],c[1],c[2]),l=(mx+mn)/510,d=mx-mn;
  if(l>.88)return 'blanco';if(l<.14)return 'negro';if(d<28)return l>.6?'gris claro':'gris';
  let hh=mx===c[0]?((c[1]-c[2])/d)%6:mx===c[1]?(c[2]-c[0])/d+2:(c[0]-c[1])/d+4;hh=(hh*60+360)%360;
  const n=hh<15||hh>=345?'rojo':hh<40?'naranja':hh<65?'amarillo':hh<165?'verde':hh<200?'celeste':hh<255?'azul':hh<290?'violeta':'rosa';
  return (l<.28?'':'')+n;
}
function aplicarColores(){
  let r;try{r=document.documentElement}catch(e){}
  if(!r||!r.style)return;
  const P=paleta(),dk=oscuro();
  [['local','local'],['visitante','visit']].forEach(x=>{
    const c=P[x[0]],l=lum(c.c1),txt=dk?(l<.2?mez(c.c1,'#FFFFFF',.5):c.c1):(l>.55?mez(c.c1,'#000000',.45):c.c1);
    const sobre=contr(c.c1,'#FFFFFF')>=contr(c.c1,'#14201A')?'#FFFFFF':'#14201A';
    const k=x[1],set=(n,v)=>r.style.setProperty('--'+k+n,v);
    r.style.setProperty('--'+k,txt);set('raw',c.c1);set('2',c.c2);set('x',sobre);set('j',contr(c.c1,c.c2)>=3?c.c2:sobre);
  });
}
/* Escudo: la imagen de la base (TEAMS[k].escudo) o, si no hay, uno generado con la inicial del equipo */
function escudoSrc(eq){
  const k=tk(eq),t=k&&TEAMS[k];
  if(t&&t.escudo)return t.escudo;
  const col=paleta()[eq].c1,col2=paleta()[eq].c2,ini=esc(((t&&t.nombre)||'?').trim().charAt(0).toUpperCase());
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120"><path d="M50 4 94 20v40c0 28-19 46-44 56C25 106 6 88 6 60V20z" fill="'+col+'"/><path d="M50 14 84 27v33c0 22-14 37-34 46C30 97 16 82 16 60V27z" fill="none" stroke="'+col2+'" stroke-width="5"/><text x="50" y="76" font-family="Arial,sans-serif" font-size="52" font-weight="700" text-anchor="middle" fill="'+col2+'">'+ini+'</text></svg>';
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}
const escudoCss=eq=>"url('"+escudoSrc(eq)+"')";
const tn=eq=>{const k=tk(eq);return k?TEAMS[k].nombre:(eq==='local'?'Local':'Visitante')};
const jugs=eq=>{const k=tk(eq);return k?TEAMS[k].jug.map((j,i)=>({id:k+'-'+(i+1),n:j.n,alt:j.alt,pos:j.pos})):[]};
const pres=eq=>jugs(eq).filter(j=>(S.plant[eq][j.id]||{}).p);
const cam=(eq,id)=>(S.plant[eq][id]||{}).c||'?';
const jd=id=>{const p=id.split('-');return TEAMS[p[0]].jug[+p[1]-1]};
const nom=id=>({n:jd(id).n});
const corto=n=>{const p=n.split(' ');return p[0]+(p[1]?' '+p[1][0]+'.':'')};
const eqDe=id=>tk('local')===id.split('-')[0]?'local':'visitante';
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const mmss=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const tNow=()=>qstart(S.cuarto)+S.sec;
const r1=v=>Math.round(v*10)/10;
const pct=(a,b)=>b?Math.round(100*a/b)+'%':'–';
function quien(e,id){id=id||e.jug;return '#'+cam(e.equipo,id)+' '+corto(nom(id).n)}
function desc(e){
  const q=qlab(e.cuarto)+' · '+mmss(qlen(e.cuarto)-(e.t-qstart(e.cuarto)))+' · ';
  if(e.tipo==='TM')return q+tn(e.equipo)+' · Tiempo muerto';
  if(e.tipo==='CAMBIO')return q+tn(e.equipo)+' · '+(!e.j2?'Sale '+quien(e)+' sin reemplazo':!e.jug?'Entra '+quien(e,e.j2)+' (suma un jugador)':'Cambio: sale '+quien(e)+', entra '+quien(e,e.j2));
  if(e.tipo==='FALTA'&&(e.det==='entrenador'||e.det==='banco'))return q+tn(e.equipo)+' · Falta técnica al '+(e.det==='entrenador'?'entrenador':'banco');
  if(e.tipo==='FALTA')return q+tn(e.equipo)+' · Falta '+(e.det==='tecnica'?'técnica':e.det)+' · '+quien(e);
  return q+tn(e.equipo)+' · '+ETQ[e.tipo]+(e.tipo==='REB'?({O:' ofensivo',D:' defensivo'})[repDet(e)]||'':'')+(e.tipo==='PER'&&e.ref?' tras robo':'')+' · '+(e.jug?quien(e):'sin identificar');
}

/* ---------- Motor: reproduce el partido desde cero con los eventos vigentes ---------- */
/* Rebote ofensivo (O) o defensivo (D): sale de a quién pertenece el tiro errado al que responde (ref) */
function repDet(e,list){const rf=(list||S.ev).find(x=>x.id===e.ref);return rf?(rf.equipo===e.equipo?'O':'D'):null}
function calc(list,tn_){
  const tF=tn_==null?tNow():tn_;
  const ord=list.filter(e=>!e.anulado).sort((a,b)=>a.seq-b.seq||a.id-b.id);
  const R={err:null,warn:[],on:{local:[],visitante:[]},sc:{local:0,visitante:0},
    par:[0,1,2,3].map(()=>({local:0,visitante:0})),perT:{local:0,visitante:0},pts:{},f:{},fte:{},fan:{},desc:{},reb:{},rebo:{},rebd:{},rob:{},per:{},ast:{},min:{},
    c1:{},c2:{},c3:{},x1:{},x2:{},x3:{},
    ft:{local:[0,0,0,0],visitante:[0,0,0,0]},tm:{local:0,visitante:0},jugo:new Set(),
    tmU:{local:{h1:0,h2:0,ot:{}},visitante:{h1:0,h2:0,ot:{}}},
    tec:{local:{c:0,b:0},visitante:{c:0,b:0}},dqEnt:{}};
  const ent={},val={P1:1,P2:2,P3:3},inc=(o,k)=>{o[k]=(o[k]||0)+1};
  const mapa={P1:'c1',P2:'c2',P3:'c3',X1:'x1',X2:'x2',X3:'x3',REB:'reb',ROB:'rob',PER:'per',AST:'ast',FALTA:'f'};
  for(const e of ord){
    const on=R.on[e.equipo];
    while(R.par.length<e.cuarto){R.par.push({local:0,visitante:0});R.ft.local.push(0);R.ft.visitante.push(0)}
    if(e.tipo==='TM'){
      const u=R.tmU[e.equipo],nom_=tn(e.equipo);
      if(e.cuarto<=2){if(u.h1>=2){R.err=nom_+' ya usó sus 2 tiempos muertos de la primera mitad.';break}u.h1++}
      else if(e.cuarto<=4){
        if(u.h2>=3){R.err=nom_+' ya usó sus 3 tiempos muertos de la segunda mitad.';break}
        if(u.h2===2&&!(e.cuarto===4&&e.t>=qstart(4)+qlen(4)-TM_FINAL)){R.err=nom_+': el tercer tiempo muerto se puede pedir recién en los últimos 2 minutos del 4.º cuarto.';break}
        u.h2++}
      else{if((u.ot[e.cuarto]||0)>=1){R.err=nom_+' ya usó su tiempo muerto de este suplementario.';break}u.ot[e.cuarto]=1}
      R.tm[e.equipo]++;continue}
    if(e.tipo==='FALTA'&&(e.det==='entrenador'||e.det==='banco')){   /* técnica al entrenador (C) o al banco (B): no es de un jugador y no cuenta como falta de equipo */
      const u=R.tec[e.equipo];u[e.det==='entrenador'?'c':'b']++;
      if(!R.dqEnt[e.equipo]&&(u.c>=2||u.c+u.b>=3)){R.dqEnt[e.equipo]=u.c>=2?'2 técnicas del entrenador':'3 técnicas entre entrenador y banco';R.warn.push('El entrenador de '+tn(e.equipo)+' quedó descalificado ('+R.dqEnt[e.equipo]+').')}
      continue}
    if(e.jug&&eqDe(e.jug)!==e.equipo){R.err='El evento «'+desc(e)+'» pone a un jugador en el equipo equivocado.';break}
    if(e.tipo==='QUINTETO'){if(!on.includes(e.jug)){on.push(e.jug);ent[e.jug]=e.t}R.jugo.add(e.jug);continue}
    if(e.tipo==='CAMBIO'){   /* normal (sale y entra) · sin reemplazo (j2 vacío) · suma un jugador (jug vacío) */
      if(e.j2&&eqDe(e.j2)!==e.equipo){R.err='El que entra en «'+desc(e)+'» no es de ese equipo.';break}
      if(e.j2&&R.desc[e.j2]){R.err=quien(e,e.j2)+' está descalificado ('+R.desc[e.j2]+') y no puede volver a entrar.';break}
      if(e.jug&&!on.includes(e.jug)){R.err=quien(e)+' no estaba en cancha para salir en «'+desc(e)+'».';break}
      if(e.j2&&on.includes(e.j2)){R.err=quien(e,e.j2)+' ya estaba en cancha en «'+desc(e)+'».';break}
      if(!e.jug&&on.length>=5){R.err=tn(e.equipo)+' ya tiene 5 en cancha: no se puede sumar otro jugador.';break}
      if(e.jug){R.min[e.jug]=(R.min[e.jug]||0)+Math.max(0,e.t-ent[e.jug]);delete ent[e.jug]}
      if(e.jug&&e.j2)on[on.indexOf(e.jug)]=e.j2;else if(e.jug)on.splice(on.indexOf(e.jug),1);else on.push(e.j2);
      if(e.j2){ent[e.j2]=e.t;R.jugo.add(e.j2)}
      continue}
    if(e.tipo==='PER'&&!e.jug){R.perT[e.equipo]++;continue}   /* pérdida sin identificar (por ejemplo, tras un robo) */
    if(!on.includes(e.jug)){R.err=quien(e)+' no estaría en cancha en «'+desc(e)+'».';break}
    if(e.tipo==='AST'){
      const ref=list.find(x=>x.id===e.ref);
      if(ref&&ref.jug===e.jug){R.err='Un jugador no puede asistirse a sí mismo: «'+desc(e)+'».';break}}
    if(val[e.tipo]){
      R.sc[e.equipo]+=val[e.tipo];R.par[e.cuarto-1][e.equipo]+=val[e.tipo];
      R.pts[e.jug]=(R.pts[e.jug]||0)+val[e.tipo]}
    if(e.tipo==='FALTA')R.ft[e.equipo][e.cuarto-1]++;
    if(mapa[e.tipo])inc(R[mapa[e.tipo]],e.jug);
    if(e.tipo==='FALTA'){   /* descalificación: 5 faltas · 2 técnicas · antideportiva + técnica · 1 descalificante */
      if(e.det==='tecnica')inc(R.fte,e.jug);if(e.det==='antideportiva')inc(R.fan,e.jug);
      if(!R.desc[e.jug]){
        const te=R.fte[e.jug]||0,an=R.fan[e.jug]||0;
        const m=e.det==='descalificante'?'falta descalificante':te>=2?'2 faltas técnicas':(te>=1&&an>=1)?'antideportiva + técnica':an>=2?'2 faltas antideportivas':(R.f[e.jug]||0)>=5?'5 faltas':null;
        if(m)R.desc[e.jug]=m}}
    if(e.tipo==='REB'){const d=repDet(e,list);if(d)inc(d==='O'?R.rebo:R.rebd,e.jug)}   /* ofensivo: lo agarra el equipo que tiró; defensivo: el rival */
  }
  for(const id in ent)R.min[id]=(R.min[id]||0)+Math.max(0,tF-ent[id]);
  if(!R.err)for(const id in R.desc)R.warn.push(quien({equipo:eqDe(id)},id)+' quedó descalificado ('+R.desc[id]+').');
  return R;
}
const estado=()=>calc(S.ev);
const marc=R=>R.sc.local+'–'+R.sc.visitante;
/* Valoración propia: cada acción pesa lo que dice CFG.val (se ve en Estadísticas) */
function valo(R,id){

}
const sumEq=(R,eq,k)=>pres(eq).reduce((a,j)=>a+(R[k][j.id]||0),0)+(k==='per'?R.perT[eq]:0);
const tc=(R,id)=>({m:(R.c2[id]||0)+(R.c3[id]||0),a:(R.c2[id]||0)+(R.c3[id]||0)+(R.x2[id]||0)+(R.x3[id]||0)});
const t3=(R,id)=>({m:R.c3[id]||0,a:(R.c3[id]||0)+(R.x3[id]||0)});
const tl=(R,id)=>({m:R.c1[id]||0,a:(R.c1[id]||0)+(R.x1[id]||0)});
function tot(R,eq,f){return pres(eq).reduce((a,j)=>{const x=f(R,j.id);return {m:a.m+x.m,a:a.a+x.a}},{m:0,a:0})}

/* ---------- Emparejamiento y sugerencias ---------- */
/* Cada jugador en cancha marca a un rival. Por defecto, el de su misma posición (o el más parecido en altura);
   el oficial puede cambiarlo (S.par). Devuelve {id local: id visitante}. */
function pares(onL,onV){
  const ord=a=>a.map(id=>({id,p:POSRANK[jd(id).pos],a:jd(id).alt})).sort((x,y)=>x.p-y.p||x.a-y.a).map(x=>x.id);
  const L=ord(onL),V=ord(onV),auto={},out={},used=new Set();
  L.forEach((l,i)=>{if(V[i])auto[l]=V[i]});
  onL.forEach(l=>{const m=S.par[l];if(m&&onV.includes(m)&&!used.has(m)){out[l]=m;used.add(m)}});
  onL.forEach(l=>{if(out[l])return;const a=auto[l];if(a&&!used.has(a)){out[l]=a;used.add(a)}});
  onL.forEach(l=>{if(out[l])return;const f=onV.find(v=>!used.has(v));if(f){out[l]=f;used.add(f)}});
  return out;
}
function emparejar(R){const p=pares(R.on.local,R.on.visitante),m={};for(const l in p){m[l]=p[l];m[p[l]]=l}return m}
const ultimoDe=(eq)=>S.ev.filter(e=>!e.anulado&&e.equipo===eq&&e.jug&&!['QUINTETO','CAMBIO','AST'].includes(e.tipo)).sort((a,b)=>b.seq-a.seq)[0];
function puntaje(act,eq,id,R,par){
  const d=jd(id),b=POSRANK[d.pos];
  let s=0,why='';
  if(act==='REB'){s=(d.alt-170)/4+[-1,0,2,4,6][b];why=POS[d.pos].toLowerCase()+' · '+d.alt+' cm'}
  else if(act==='ROB'){s=[5,4,2,0,-1][b]+(200-d.alt)/8;why=POS[d.pos].toLowerCase()+' · rápido'}
  else if(act==='PER'){s=[5,4,3,1,1][b]+(200-d.alt)/20;why='maneja la bola'}
  else if(act==='AST'){s=[5,4,3,1,1.5][b]+(200-d.alt)/25;why=b<=2?'reparte el juego':'pasa desde adentro'}
  else if(act==='FALTA'){
    s=[0,0,1,2,2][b]+(R.f[id]||0)*.2;why=POS[d.pos].toLowerCase()+' · contacto';
    const u=ultimoDe(otro(eq));
    if(u&&par[id]===u.jug){s+=6;why='marca a #'+cam(otro(eq),u.jug)+' ('+(PUNTOS.includes(u.tipo)?'punto':ETQ[u.tipo].toLowerCase())+')'}
  }
  else if(/^[PX][123]$/.test(act)){
    const n=act[1],g=k=>R[k][id]||0,tiros=g('c'+n)+g('x'+n),otros=g('c1')+g('x1')+g('c2')+g('x2')+g('c3')+g('x3')-tiros,nm=({1:'libres',2:'dobles',3:'triples'})[n];
    s=({1:[3,3,2,2,1],2:[1,2,3,4,4],3:[4,4,3,1,0]})[n][b]+tiros*1.5+otros*.3;
    why=POS[d.pos].toLowerCase()+' · '+(tiros?tiros+' '+nm:'sin '+nm+' aún');
  }
  else if(act==='CAMBIO'){s=(R.min[id]||0)+(R.f[id]||0)*.01;why=Math.round((R.min[id]||0)/60)+' min · '+(R.f[id]||0)+' faltas'}   /* los 3 con más minutos */
  return {s,why};
}
/* ---------- Sugerencias con historial (fase 1) ----------
   El punto de partida es altura y posición (más lo que pasa en este partido). A medida que un jugador acumula minutos, su historial real
   (rebotes, robos, asistencias, pérdidas, faltas y tiros POR MINUTO) pesa cada vez más: con HK minutos de historial pesa lo mismo que el punto de partida. */
const HK=120;
const HIST_ACT={REB:h=>h.reb,ROB:h=>h.rob,PER:h=>h.per,AST:h=>h.ast,FALTA:h=>h.f,'1':h=>h.t1,'2':h=>h.t2,'3':h=>h.t3};
const HIST_TXT={REB:'rebotes',ROB:'robos',PER:'pérdidas',AST:'asistencias',FALTA:'faltas','1':'libres','2':'dobles','3':'triples'};
const claveHist=act=>/^[PX][123]$/.test(act)?act[1]:(HIST_ACT[act]?act:null);
function mezclarHist(act,items){
  const k=claveHist(act);if(!k||items.length<2)return items;
  const f=HIST_ACT[k],datos=items.map(it=>{const h=(jd(it.id)||{}).h;return h&&h.min>=10?{h,m:h.min,r:f(h)/h.min}:null});
  const T=3,e=items.map(it=>Math.exp(it.s/T)),E=e.reduce((a,b)=>a+b,0),prior=e.map(x=>x/E);   // punto de partida → reparto entre los que están en cancha
  let sumR=0,masa=0;datos.forEach((d,i)=>{if(d){sumR+=d.r;masa+=prior[i]}});
  if(!(sumR>0))return items;                                                                     // nadie tiene historial de esta acción: queda como estaba
  return items.map((it,i)=>{
    const d=datos[i];if(!d)return Object.assign({},it,{s:prior[i]*10});
    const w=d.m/(d.m+HK),hist=masa*(d.r/sumR),p=(1-w)*prior[i]+w*hist,pp=d.h.pj?f(d.h)/d.h.pj:0,num=String(Math.round(pp*10)/10).replace('.',',');
    const why=(w>=.35&&!/^marca a/.test(it.why))?num+' '+HIST_TXT[k]+' por partido · '+d.h.pj+' PJ':it.why;
    return Object.assign({},it,{s:p*10,why});
  });
}
function sugeridos(act,eq,R,excl){
  const par=emparejar(R);
  const items=R.on[eq].filter(id=>id!==excl&&!R.desc[id]).map(id=>Object.assign({id},puntaje(act,eq,id,R,par)));
  return mezclarHist(act,items).sort((a,b)=>b.s-a.s).slice(0,3);
}

/* ---------- Altas, deshacer y corrección (nunca se borra: se anula y se agrega) ---------- */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},4200)}
function addEv(o){
  const e=Object.assign({id:S.nid++,seq:S.nseq++,cuarto:S.cuarto,t:tNow(),anulado:false,corrige:null},o);
  S.ev.push(e);
  const R=estado();
  if(R.err){S.ev.pop();S.nid--;S.nseq--;toast(R.err);return false}
  return true;
}
function simular(id,c){
  const antes=estado(),orig=S.ev.find(x=>x.id===id);
  const copia=S.ev.map(x=>Object.assign({},x));copia.find(x=>x.id===id).anulado=true;
  let nuevoEv=null;
  if(!c.anular){nuevoEv=Object.assign({},orig,c,{id:9e6,corrige:id,anulado:false});copia.push(nuevoEv)}
  return {antes,despues:calc(copia),orig,nuevoEv};
}
function confirmarCambio(id,c,accion){
  const s=simular(id,c);
  if(s.despues.err){toast('No se aplicó: '+s.despues.err);return false}
  const orig=S.ev.find(x=>x.id===id);orig.anulado=true;
  let nid=null;
  if(!c.anular){const n=Object.assign({},orig,c,{id:S.nid++,seq:orig.seq,corrige:id,anulado:false});S.ev.push(n);nid=n.id;if(n.tipo==='REB')n.det=repDet(n)}
  S.corr.push({n:S.corr.length+1,accion,antes:desc(orig),despues:nid?desc(S.ev.find(x=>x.id===nid)):'Anulado',
    mA:marc(s.antes),mD:marc(s.despues),orig:id,nuevo:nid,rev:false});
  return true;
}
function anularConPar(e,accion){
  const par=e.tipo==='PER'&&e.ref?S.ev.find(x=>x.id===e.ref&&!x.anulado&&x.tipo==='ROB'):null;   /* una pérdida tras robo se cancela junto con su robo */
  if(!confirmarCambio(e.id,{anular:true},accion))return false;
  if(par)confirmarCambio(par.id,{anular:true},accion+' (robo de esa pérdida)');
  toast('Cancelado: '+desc(e)+(par?' y su robo':''));return true;
}
function deshacer(){
  const act=S.ev.filter(e=>!e.anulado&&e.tipo!=='QUINTETO').sort((a,b)=>b.seq-a.seq||b.id-a.id)[0];
  if(!act){toast('No hay nada para deshacer.');return}
  anularConPar(act,'Deshacer');
}
function revertirUltima(){
  const c=[...S.corr].reverse().find(x=>!x.rev);if(!c)return;
  const orig=S.ev.find(x=>x.id===c.orig),nu=c.nuevo?S.ev.find(x=>x.id===c.nuevo):null;
  orig.anulado=false;if(nu)nu.anulado=true;
  const R=estado();
  if(R.err){orig.anulado=true;if(nu)nu.anulado=false;toast('No se pudo revertir: '+R.err);return}
  c.rev=true;toast('Corrección revertida: el partido volvió a como estaba.');
}

function tmEstado(R,eq){
  const u=R.tmU[eq],c=S.cuarto,fin=c===4&&qlen(4)-S.sec<=TM_FINAL,L=[];
  for(let i=0;i<2;i++)L.push({k:GRUPOS_TM[0][0],g:'1.ª mitad',s:i<u.h1?'used':(c<=2?'ok':'exp')});
  for(let i=0;i<2;i++)L.push({k:GRUPOS_TM[1][0],g:'2.ª mitad',s:i<Math.min(u.h2,2)?'used':(c<=2?'pen':c<=4?'ok':'exp')});
  L.push({k:GRUPOS_TM[2][0],g:'final del 4.º',s:u.h2>=3?'used':(c<=3?'pen':c===4?(fin?'ok':'pen'):'exp')});
  for(let q=5;q<=Math.max(c,5);q++)L.push({k:GRUPOS_TM[3][0],g:'suplementario '+(q-4),ot:1,s:(u.ot[q]||0)>=1?'used':(q===c?'ok':(q>c?'pen':'exp'))});
  return L;
}

const corta=e=>ETQ[e.tipo]+(e.tipo==='TM'?' de '+tn(e.equipo):' · '+(e.jug?quien(e):'sin identificar'));
function alertas(R){
  /* Los avisos de eventos raros SE MANTIENEN hasta que el evento se corrija, se cancele o se marque «está bien» (✕). */
  const A=[],ign=S.ui.ign||{},bt=id=>[['Corregir','corr',{id}],['Cancelar','anularEv',{id}]];
  ['local','visitante'].forEach(eq=>{
    R.on[eq].filter(id=>R.desc[id]).forEach(id=>A.push({k:'dq-'+id,sev:'rojo',fijo:1,txt:'<b>#'+esc(cam(eq,id))+' '+esc(corto(nom(id).n))+' · descalificado</b> ('+esc(R.desc[id])+'). Tiene que salir del partido.',btns:[['Cambiar','dqCambio',{eq,id}]]}));
    const n=R.on[eq].length,banco=pres(eq).filter(j=>!R.on[eq].includes(j.id)&&!R.desc[j.id]).length;
    if(n<2)A.push({k:'min-'+eq,sev:'rojo',fijo:1,txt:'<b>'+esc(tn(eq))+'</b> quedó con menos de 2 jugadores: en el reglamento habitual el partido se da por perdido. Confirmalo con la liga.'});
    else if(n<5&&banco>0)A.push({k:'ba-'+eq+'-'+n,sev:'amar',txt:'<b>'+esc(tn(eq))+'</b> juega con '+n+'. Podés sumar un jugador del banco.',btns:[['Sumar','sumar',{eq}]]});
  });
  const act=S.ev.filter(e=>!e.anulado&&e.tipo!=='QUINTETO').sort((a,b)=>a.seq-b.seq||a.id-b.id),sus=[],val={P1:1,P2:2,P3:3};
  for(let i=1;i<act.length;i++){
    const u=act[i],v=act[i-1];if(u.cuarto!==v.cuarto)continue;
    const dt=Math.abs(u.t-v.t);
    if(u.tipo===v.tipo&&u.equipo===v.equipo&&u.jug===v.jug&&u.j2===v.j2&&u.tipo!=='AST'&&dt<=(u.tipo==='TM'?15:3))
      sus.push({k:'dup-'+u.id,sev:'amar',txt:'Se anotó dos veces seguidas «'+esc(corta(u))+'» en '+dt+' s. ¿Fue un toque de más?',btns:bt(u.id)});
    if(u.tipo==='CAMBIO'&&v.tipo==='CAMBIO'&&u.equipo===v.equipo&&u.jug&&u.jug===v.j2&&dt<=20)
      sus.push({k:'cc-'+u.id,sev:'amar',txt:'Entró y salió el mismo jugador en '+dt+' s. ¿Se cargó al revés?',btns:bt(u.id)});
    if(u.t<v.t-30)
      sus.push({k:'rt-'+u.id,sev:'amar',txt:'«'+esc(corta(u))+'» marca '+(v.t-u.t)+' s antes que el evento anterior. ¿Reloj o cuarto equivocado?',btns:bt(u.id)});
    if(val[u.tipo]){
      const suma=act.filter(e=>e.cuarto===u.cuarto&&e.equipo===u.equipo&&val[e.tipo]&&e.t<=u.t&&u.t-e.t<=60&&e.seq<=u.seq).reduce((a,e)=>a+val[e.tipo],0);
      if(suma>=12&&suma-val[u.tipo]<12)
        sus.push({k:'rc-'+u.id,sev:'amar',txt:'<b>'+esc(tn(u.equipo))+'</b> suma '+suma+' puntos en menos de 1 minuto. ¿Hay eventos repetidos?',btns:bt(u.id)});
    }
  }
  return A.concat(sus.reverse()).filter(a=>a.fijo||!ign[a.k]).sort((a,b)=>(a.sev==='rojo'?0:1)-(b.sev==='rojo'?0:1));
}

  return '<div class="'+(eq==='local'?'tl':'tv')+'"><h4>'+esc(tn(eq))+' · '+R.sc[eq]+' <small>faltas del cuarto '+faltasEq+(faltasEq>=PENAL?' 🚩':'')+(R.tec[eq].c||R.tec[eq].b?' · técnicas: entrenador '+R.tec[eq].c+' · banco '+R.tec[eq].b+(R.dqEnt[eq]?' ⛔':''):'')+'</small></h4><div class="tblw"><table class="tm"><thead><tr><th>En cancha</th><th>Min</th><th>Pts</th><th>Reb</th><th>Ast</th><th>Rob</th><th>Fal</th><th>Val</th></tr></thead><tbody>'
  +ids.map(id=>'<tr class="'+(R.desc[id]?'dq':'on')+'"><td><b class="num">'+esc(cam(eq,id))+'</b> '+esc(corto(nom(id).n))+(R.desc[id]?' <span class="badge bad">desc.</span>':'')+'</td><td data-min="'+id+'">'+mmss(R.min[id]||0)+'</td><td>'+(R.pts[id]||0)+'</td><td>'+(R.reb[id]||0)+'</td><td>'+(R.ast[id]||0)+'</td><td>'+(R.rob[id]||0)+'</td><td'+((R.f[id]||0)>=4?' class="fl4"':'')+'>'+(R.f[id]||0)+'</td><td class="v">'+valo(R,id)+'</td></tr>').join('')
  +'</tbody></table></div></div>';
}

  +(ui.hint?'<div class="note"><b>Probá la corrección.</b> El último triple de '+esc(tn('local'))+' está cargado al jugador equivocado. Activá «Corregir eventos» y tocá <i>Corregir</i>.</div>':'')
  +'<details class="mas"><summary>Herramientas de prueba</summary><div style="display:grid;gap:8px"><button class="btn alt small" data-act="demo">Cargar un ejemplo de eventos</button><button class="btn alt small" data-act="vel">Reloj '+(S.vel===1?'normal':'rápido ×30 (solo prueba)')+'</button></div></details>'

function tablaJug(R,eq){
  const ids=pres(eq).map(j=>j.id).filter(id=>R.jugo.has(id)||R.min[id]);
  const f=(fn,id)=>{const x=fn(R,id);return x.a?x.m+'/'+x.a:'–'};
  const T=(fn)=>{const x=tot(R,eq,fn);return x.a?x.m+'/'+x.a:'–'};
  return '<div class="tblw"><table><thead><tr><th>'+esc(tn(eq))+'</th><th>Min</th><th>Pts</th><th>TC</th><th>3P</th><th>TL</th><th>RO</th><th>RD</th><th>Reb</th><th>Ast</th><th>Rob</th><th>Per</th><th>Fal</th><th>Val</th></tr></thead><tbody>'
  +ids.map(id=>'<tr'+(R.desc[id]?' class="dq"':'')+'><td>#'+esc(cam(eq,id))+' '+esc(corto(nom(id).n))+(R.desc[id]?' <span class="badge bad">descalificado</span>':R.on[eq].includes(id)?' <span class="badge ok">en cancha</span>':'')+'</td><td data-min="'+id+'">'+mmss(R.min[id]||0)+'</td><td>'+(R.pts[id]||0)+'</td><td>'+f(tc,id)+'</td><td>'+f(t3,id)+'</td><td>'+f(tl,id)+'</td><td>'+(R.rebo[id]||0)+'</td><td>'+(R.rebd[id]||0)+'</td><td>'+(R.reb[id]||0)+'</td><td>'+(R.ast[id]||0)+'</td><td>'+(R.rob[id]||0)+'</td><td>'+(R.per[id]||0)+'</td><td>'+(R.f[id]||0)+((R.f[id]||0)>=5?' <span class="badge bad">5</span>':'')+'</td><td class="v">'+valo(R,id)+'</td></tr>').join('')
  +'<tr class="tot"><td>Equipo</td><td></td><td>'+R.sc[eq]+'</td><td>'+T(tc)+'</td><td>'+T(t3)+'</td><td>'+T(tl)+'</td><td>'+sumEq(R,eq,'rebo')+'</td><td>'+sumEq(R,eq,'rebd')+'</td><td>'+sumEq(R,eq,'reb')+'</td><td>'+sumEq(R,eq,'ast')+'</td><td>'+sumEq(R,eq,'rob')+'</td><td>'+sumEq(R,eq,'per')+'</td><td>'+sumEq(R,eq,'f')+'</td><td>'+r1(ids.reduce((a,id)=>a+valo(R,id),0))+'</td></tr></tbody></table></div>';
}

function vCorr(){
  const c=S.ui.corr;if(!c)return '';
  const e=S.ev.find(x=>x.id===c.id);if(!e)return '';
  const modos=[];
  if(e.tipo==='FALTA'&&!e.jug)modos.push(['equipo','Cambiar equipo']);
  else if(NEEDJ.includes(e.tipo)){modos.push(['jugador','Cambiar jugador'],['equipo','Cambiar equipo']);
    if(PUNTOS.includes(e.tipo)||ERRADOS.includes(e.tipo)||e.tipo==='FALTA')modos.push(['tipo',e.tipo==='FALTA'?'Cambiar tipo de falta':ERRADOS.includes(e.tipo)?'Cambiar ✗1 / ✗2 / ✗3':'Cambiar +1 / +2 / +3'])}
  if(e.tipo==='TM')modos.push(['equipo','Cambiar equipo']);
  if(e.tipo==='CAMBIO'&&e.j2&&e.jug)modos.push(['j2','Cambiar quién entra']);
  modos.push(['cuarto','Mover de período'],['anular','Anular evento']);
  let opts='';
  if(c.modo==='jugador')opts=pres(e.equipo).filter(j=>j.id!==e.jug).map(j=>[j.id,'#'+cam(e.equipo,j.id)+' '+corto(j.n)]);
  if(c.modo==='equipo')opts=(e.tipo==='TM'||(e.tipo==='FALTA'&&!e.jug))?[[otro(e.equipo),'Pasar a '+tn(otro(e.equipo))]]:pres(otro(e.equipo)).map(j=>[j.id,tn(otro(e.equipo))+' · #'+cam(otro(e.equipo),j.id)+' '+corto(j.n)]);
  if(c.modo==='tipo')opts=e.tipo==='FALTA'?FALTAS.filter(f=>f[0]!==e.det).map(f=>[f[0],f[1]]):(ERRADOS.includes(e.tipo)?ERRADOS:PUNTOS).filter(t=>t!==e.tipo).map(t=>[t,ETQ[t]]);
  if(c.modo==='cuarto')opts=S.ev.reduce((m,x)=>Math.max(m,x.cuarto),4)&&Array.from({length:Math.max(4,...S.ev.map(x=>x.cuarto))},(_,i)=>i+1).filter(q=>q!==e.cuarto).map(q=>[String(q),qlab(q)+(q<=4?' cuarto':'')]);
  if(c.modo==='j2')opts=pres(e.equipo).filter(j=>j.id!==e.jug&&j.id!==e.j2).map(j=>[j.id,'#'+cam(e.equipo,j.id)+' '+corto(j.n)]);
  let prev='';
  const cambio=cambioObj(e,c);
  if(cambio){
    const s=simular(e.id,cambio);
    prev='<div class="cmp"><div><span class="badge">Antes</span>'+esc(desc(e))+'</div><div><span class="badge ok">Después</span>'+esc(cambio.anular?'Evento anulado':desc(Object.assign({},e,cambio)))+'</div><div>Marcador: <b>'+marc(s.antes)+'</b> → <b>'+marc(s.despues)+'</b></div></div>'
    +(s.despues.err?'<p class="note"><b>No se puede aplicar.</b> '+esc(s.despues.err)+'</p>':'')
    +'<div class="bar"><button class="btn" data-act="cfm"'+(s.despues.err?' disabled':'')+'>Confirmar corrección</button><button class="btn alt" data-act="corrOff">Cancelar</button></div>';
  }else prev='<div class="bar" style="grid-template-columns:1fr"><button class="btn alt" data-act="corrOff">Cancelar</button></div>';
  return '<div class="over" data-act="corrBg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Corregir evento"><h3>Corregir evento #'+e.id+'</h3><p>'+esc(desc(e))+'</p>'
  +'<div class="opts">'+modos.map(m=>'<button data-act="cmodo" data-m="'+m[0]+'" class="'+(c.modo===m[0]?'on':'')+'">'+m[1]+'</button>').join('')+'</div>'
  +(opts?'<p class="hint">Elegí el valor correcto</p><div class="opts">'+opts.map(o=>'<button data-act="cval" data-v="'+esc(o[0])+'" class="'+(c.val===o[0]?'on':'')+'">'+esc(o[1])+'</button>').join('')+'</div>':'')
  +prev+'<p class="hint">El original no se borra: queda anulado y se registra la corrección.</p></div></div>';
}
function cambioObj(e,c){
  if(c.modo==='anular')return {anular:true};
  if(!c.modo||c.val==null)return null;
  if(c.modo==='jugador')return {jug:c.val};
  if(c.modo==='equipo')return (e.tipo==='TM'||(e.tipo==='FALTA'&&!e.jug))?{equipo:otro(e.equipo)}:{equipo:otro(e.equipo),jug:c.val};
  if(c.modo==='tipo')return e.tipo==='FALTA'?{det:c.val}:{tipo:c.val};
  if(c.modo==='cuarto')return {cuarto:+c.val};

/* PDF mínimo: una imagen JPEG por página A4. No necesita librerías y funciona sin conexión. */
function armarPDF(urls,w,h){
  const enc=new TextEncoder(),partes=[],offs=[];let len=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;partes.push(u);len+=u.length};
  const obj=(n,fn)=>{offs[n]=len;push(n+' 0 obj\n');fn();push('\nendobj\n')};
  const jpg=urls.map(u=>{const b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a});
  const N=urls.length,pw=595,ph=842,kids=[];for(let i=0;i<N;i++)kids.push((3+i*3)+' 0 R');
  push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+N+' >>'));
  for(let i=0;i<N;i++){
    const pn=3+i*3,cs='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
    obj(pn,()=>push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 '+(pn+2)+' 0 R >> >> /Contents '+(pn+1)+' 0 R >>'));
    obj(pn+1,()=>push('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream'));
    obj(pn+2,()=>{push('<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg[i].length+' >>\nstream\n');push(jpg[i]);push('\nendstream')});
  }
  const xr=len,total=3+N*3;let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let n=1;n<total;n++)x+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(partes,{type:'application/pdf'});
}

    if(u.acc==='BP'){   /* Robo / Pérdida: robo = quién robó y luego quién la perdió; pérdida = quién la perdió */
      const b=u.bp;
      if(!b||!b.m){toast('Elegí Robo o Pérdida.');return}
      if(b.m==='PER'){cerrarBP({eq:d.eq,id:d.id});return}
      if(!b.th){b.th={eq:d.eq,id:d.id,rk:rankDe('ROB',d.eq,d.id)};u.todos=false;render();return}
      if(d.eq===b.th.eq){toast('La pérdida es de un jugador del equipo contrario.');return}
      cerrarBP({eq:d.eq,id:d.id});return}
    if(u.acc==='TM'){toast('Elegí el equipo en el recuadro.');return}
    if(u.pf||u.pc){toast('Terminá el paso de arriba o tocá Cancelar.');return}
    if(u.acc==='FALTA'){u.pf={eq:d.eq,id:d.id,rk:u.todos?0:rankDe('FALTA',d.eq,d.id)};render();return}
    if(u.acc==='CAMBIO'){u.pc={eq:d.eq,id:d.id,rk:rankDe('CAMBIO',d.eq,d.id)};render();return}
    const tipo=u.acc,rk=['REB','ROB','PER'].concat(PUNTOS,ERRADOS).includes(tipo)?rankDe(tipo,d.eq,d.id):undefined;
    if(addEv({equipo:d.eq,jug:d.id,tipo,det:null,j2:null,rk})){
      const e=S.ev[S.ev.length-1];reg(desc(e));resetAcc();
      if(ERRADOS.includes(tipo))u.reb={eq:d.eq,ref:e.id,x1:tipo==='X1'};   /* tras un errado: ¿quién agarró el rebote? (de ahí salen los ofensivos y defensivos) */
      if(tipo==='P2'||tipo==='P3')u.ast={eq:d.eq,scorer:d.id,ref:e.id};            /* tras un doble o triple: ¿hubo asistencia? */
    }else resetAcc();
    render();
  },
  ast(d){
    const u=S.ui;
    if(addEv({equipo:u.ast.eq,jug:d.id,tipo:'AST',det:null,j2:null,ref:u.ast.ref,rk:rankDe('AST',u.ast.eq,d.id,u.ast.scorer)}))reg(desc(S.ev[S.ev.length-1]));
    u.ast=null;u.todos=false;render();
  },
  reb(d){
    const u=S.ui,r=u.reb;
    if(addEv({equipo:d.eq,jug:d.id,tipo:'REB',det:null,j2:null,ref:r.ref,rk:rankDe('REB',d.eq,d.id)})){const e=S.ev[S.ev.length-1];e.det=repDet(e);reg(desc(e))}
    u.reb=null;u.todos=false;render()
  },
  rebNo(){S.ui.reb=null;S.ui.todos=false;render()},
  astNo(){S.ui.ast=null;S.ui.todos=false;render()},
  tmEq(d){if(addEv({equipo:d.eq,jug:null,tipo:'TM',det:null,j2:null}))reg(desc(S.ev[S.ev.length-1]));resetAcc();render()},
  fcb(d){   /* falta técnica al entrenador o al banco */
    if(addEv({equipo:d.eq,jug:null,tipo:'FALTA',det:d.v,j2:null})){reg(desc(S.ev[S.ev.length-1]));const R=estado();toast('Falta técnica al '+(d.v==='entrenador'?'entrenador':'banco')+' de '+tn(d.eq)+(R.dqEnt[d.eq]?'. ¡El entrenador quedó descalificado!':'.'))}
    resetAcc();render()
  },
  fd(d){
    const u=S.ui,p=u.pf;let mot=null;
    if(addEv({equipo:p.eq,jug:p.id,tipo:'FALTA',det:d.d,j2:null,rk:p.rk})){reg(desc(S.ev[S.ev.length-1]));const R=estado();if(R.desc[p.id]&&R.on[p.eq].includes(p.id))mot=R.desc[p.id]}
    resetAcc();
    if(mot){u.acc='CAMBIO';u.pc={eq:p.eq,id:p.id,rk:0};toast('Descalificado ('+mot+'): elegí quién entra.')}   /* sugiere el cambio y no deja que vuelva */
    render();
  },
  sinRep(){const p=S.ui.pc;if(addEv({equipo:p.eq,jug:p.id,tipo:'CAMBIO',det:null,j2:null,rk:0}))reg(desc(S.ev[S.ev.length-1]));resetAcc();render()},
  sumar(d){resetAcc();S.ui.acc='CAMBIO';S.ui.pc={eq:d.eq,id:null,rk:0};render()},
  async informe(){
    S.ui.informe=1;render();
    try{await Promise.all([document.fonts.load('700 40px "Barlow Condensed"'),document.fonts.load('600 30px "Barlow"')])}catch(e){}
    S.ui.informe=informe(estado(),true).map(c=>c.toDataURL('image/jpeg',.8));render();
  },
  informeOff(){S.ui.informe=null;render()},
  verEv(){try{document.getElementById('s3').scrollIntoView({behavior:'smooth'})}catch(e){}},
  mc(){S.ui.mc=!S.ui.mc;render()},
  verVivo(){try{document.querySelector('.s1').scrollIntoView({behavior:'smooth'})}catch(e){}},
  anularEv(d){const e=S.ev.find(x=>x.id===+d.id);if(e&&!e.anulado)anularConPar(e,'Cancelado desde un aviso');render()},
  ntIgn(d){S.ui.ign[d.k]=1;render()},
  verJug(){try{document.getElementById('s2').scrollIntoView({behavior:'smooth'})}catch(e){}},
  dqCambio(d){resetAcc();S.ui.acc='CAMBIO';S.ui.pc={eq:d.eq,id:d.id,rk:0};render()},
  ci(d){
    const p=S.ui.pc,R=estado(),antes=pares(R.on.local,R.on.visitante),j2=d.j2||d.id;
    if(addEv({equipo:p.eq,jug:p.id,tipo:'CAMBIO',det:null,j2:j2,rk:p.rk})){
      /* el que entra hereda la marca del que sale */
      const nuevo={};
      for(const l in antes){let L=l,V=antes[l];if(L===p.id)L=j2;if(V===p.id)V=j2;nuevo[L]=V}
      S.par=nuevo;reg(desc(S.ev[S.ev.length-1]));
    }
    resetAcc();render();
  },
  parSheet(){S.ui.sheetPar=true;render()},
  parOff(){S.ui.sheetPar=false;render()},
  parBg(d,ev){if(ev.target.classList.contains('over')){S.ui.sheetPar=false;render()}},
  undo(){deshacer();render()},
  stats(d){S.ui.stats=d.v;render()},
  statsOff(){S.ui.stats=null;render()},
  statsBg(d,ev){if(ev.target.classList.contains('over')){S.ui.stats=null;render()}},
  revert(){revertirUltima();render()},
  corr(d){S.ui.corr={id:+d.id,modo:null,val:null};render()},
  cmodo(d){S.ui.corr.modo=d.m;S.ui.corr.val=null;render()},
  cval(d){S.ui.corr.val=d.v;render()},
  cfm(){
    const c=S.ui.corr,e=S.ev.find(x=>x.id===c.id),cam2=cambioObj(e,c),nombres={jugador:'Cambiar jugador',equipo:'Cambiar equipo',tipo:'Cambiar tipo',cuarto:'Mover de período',j2:'Cambiar quién entra',anular:'Anular'};
    if(confirmarCambio(c.id,cam2,nombres[c.modo])){S.ui.corr=null;toast('Corrección aplicada. El original quedó anulado y registrado.')}
    render();
  },
  corrOff(){S.ui.corr=null;render()},
  corrBg(d,ev){if(ev.target.classList.contains('over')){S.ui.corr=null;render()}},
  demo(){
    const R=estado(),L=R.on.local.slice(),V=R.on.visitante.slice();
    const banco=pres('local').map(j=>j.id).filter(id=>!L.includes(id));
    const at=(q,s)=>{S.cuarto=q;S.sec=s};
    let ult=0;
    const mk=(equipo,jug,tipo,det,j2)=>{const ok=addEv({equipo,jug,tipo,det:det||null,j2:j2||null});if(ok)ult=S.ev[S.ev.length-1].id;return ok};
    const as=(equipo,jug)=>addEv({equipo,jug,tipo:'AST',det:null,j2:null,ref:ult});
    at(1,40);mk('local',L[0],'P2');as('local',L[1]);at(1,75);mk('visitante',V[1],'P3');as('visitante',V[0]);at(1,120);mk('local',L[2],'FALTA','personal');
    at(1,121);mk('local',L[1],'P1');at(1,140);mk('local',L[3],'X2');at(1,142);mk('visitante',V[4],'REB');at(1,200);mk('visitante',V[0],'P2');
    at(1,260);mk('local',L[0],'P3');at(1,300);mk('local',L[3],'PER');at(1,301);mk('visitante',V[0],'ROB');
    at(1,330);mk('visitante',null,'TM');at(1,360);mk('local',L[2],'CAMBIO',null,banco[0]);
    at(2,30);mk('visitante',V[1],'P3');at(2,80);mk('local',banco[0],'P2');at(2,130);mk('local',L[3],'P3'); /* este triple va a L[3] pero era de L[4] */
    S.ui.hint=true;render();
  },
  toCierre(){S.ui.informe=null;S.ui.conf=false;S.fase=4;S.run=false;resetAcc();render();window.scrollTo(0,0)},
  toJuego(){S.fase=3;render();window.scrollTo(0,0)},
  cerrar(){S.ui.conf=true;render()},
  confOff(){S.ui.conf=false;render()},
  confBg(d,ev){if(ev.target.classList.contains('over')){S.ui.conf=false;render()}},
  cerrarOk(){S.ui.conf=false;S.cerrado=true;S.fly=null;S.pdf=null;render();genFlyers().then(()=>{render();return genInforme()}).then(render)},
  async pdfShare(){
    const p=S.pdf;if(!p)return;
    try{const f=new File([p.blob],p.name,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Informe del partido'});return}}catch(e){if(e&&e.name==='AbortError')return}
    ACT.pdfDown();
  },
  async pdfDown(){
    const p=S.pdf;if(!p)return;
    /* En el visor de claude.ai se guarda con la capacidad downloads; en la app real (Apps Script) alcanza un enlace con download */
    try{
      const d=window.claude&&await window.claude.use('downloads');
      if(d){await d.save({filename:p.name,data:p.blob});toast('Informe guardado.');return}
    }catch(e){if(e&&e.code==='declined')return}
    try{const a=document.createElement('a');a.href=URL.createObjectURL(p.blob);a.download=p.name;document.body.appendChild(a);a.click();a.remove()}catch(e){}
    toast('Si no se descargó, tu navegador lo bloqueó.');
  },
  copiar(){
    const t=document.getElementById('cap');if(!t)return;
    t.select();let ok=false;
    try{ok=document.execCommand('copy')}catch(e){}
    if(!ok&&navigator.clipboard)navigator.clipboard.writeText(S.cap).then(()=>toast('Descripción copiada.'),()=>toast('No pude copiar: mantené apretado el texto y elegí Copiar.'));
    else toast(ok?'Descripción copiada.':'Mantené apretado el texto y elegí Copiar.');
  },
  reabrir(){S.cerrado=false;S.fly=null;S.pdf=null;S.fase=3;toast('Partido reabierto: al volver a cerrar se reemplazan los datos, no se duplican.');render()},
  reset(){nuevo();if(TLX)aplicarTL();render();window.scrollTo(0,0)}
};
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const f=ACT[b.dataset.act];if(!f)return;
  if(b.classList.contains('pp')||b.classList.contains('cj')){   /* el jugador elegido se pinta con su equipo y recién después se registra */
    if(b.classList.contains('pick'))return;
    b.classList.add('pick');const d=Object.assign({},b.dataset);
    setTimeout(()=>{f(d,ev);b.classList.remove('pick')},170);return;
  }
  f(b.dataset,ev);
});
document.addEventListener('input',ev=>{
  const t=ev.target,k=t.dataset.in;if(!k)return;
  if(k==='camiseta'){S.plant[S.ui.tab][t.dataset.id].c=t.value}
  else if(k==='arb'||k==='mesa'){S.d[k][+t.dataset.i]=t.value}
  else if(k==='clave'){S.ui.clave=t.value;return}
  else if(k==='aj'){return}
  else{S.d[k]=t.value}
  actualizarPrevio();
});
document.addEventListener('change',ev=>{
  const t=ev.target,k=t.dataset.ch;if(!k)return;
  if(k==='lg'){S.ui.lg=t.value;S.ui.err='';return}
  if(k==='par'){
    const onL=S.fase===3?estado().on.local:S.quin.local,onV=S.fase===3?estado().on.visitante:S.quin.visitante;
    const p=pares(onL,onV),l=t.dataset.l,v=t.value,viejo=p[l];
    for(const l2 in p)if(l2!==l&&p[l2]===v)p[l2]=viejo;
    p[l]=v;S.par=p;render();return}
  if(k==='pres'){const eq=S.ui.tab;S.plant[eq][t.dataset.id]=S.plant[eq][t.dataset.id]||{p:false,c:''};S.plant[eq][t.dataset.id].p=t.checked;render();return}
  if(k==='local'||k==='visit'){
    S.d[k]=t.value;const eq=k==='local'?'local':'visitante';S.plant[eq]={};S.quin[eq]=[];S.par={};S.d.cam={local:null,visitante:null};render();return}
  S.d[k]=t.value;
});
if(TLX&&TLX.retomar)restaurar();
render();
if(TLX&&TLX._trunc)toast('Se retomó el partido. '+TLX._trunc+' jugada(s) al final no coincidían con las reglas y no se cargaron: revisalas en el historial.');
</script>
